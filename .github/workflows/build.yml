name: Build TrailFog APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  CI: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unpack the app
        run: unzip -o trailfog.zip

      # Start from the official Expo template (same as TF Test 1 and 2, which work),
      # then drop TrailFog's code into it.
      - name: Create a clean Expo project
        run: npx --yes create-expo-app@latest app --template blank --no-install

      - name: Copy TrailFog code in
        run: |
          cp -r trailfog/src trailfog/web trailfog/scripts app/
          cp trailfog/App.js trailfog/index.js trailfog/app.json app/
          cd app
          node scripts/build-map.js
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.name='trailfog';p.main='index.js';fs.writeFileSync('package.json',JSON.stringify(p,null,2))"

      - name: Install packages
        working-directory: app
        run: |
          npm install
          npx expo install expo-location expo-task-manager expo-sqlite react-native-webview

      - name: Generate Android project
        working-directory: app
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/android/app/build/outputs/apk/release/app-release.apk TrailFog.apk

      - name: Publish APK for download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TrailFog build ${{ github.run_number }}
          files: TrailFog.apk
