name: Build TrailFog APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  CI: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unpack the app
        run: unzip -o trailfog.zip

      # Start from the official Expo template so every package version matches,
      # then drop TrailFog's code into it.
      - name: Create a clean Expo project
        run: npx --yes create-expo-app@latest app --template blank --no-install

      - name: Copy TrailFog code in
        run: |
          cp -r trailfog/src app/
          cp trailfog/App.js trailfog/index.js trailfog/app.json trailfog/eas.json app/
          cd app
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.name='trailfog';p.main='index.js';fs.writeFileSync('package.json',JSON.stringify(p,null,2))"

      - name: Add Google Maps key
        working-directory: app
        env:
          MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
        run: |
          sed -i "s/PASTE_YOUR_GOOGLE_MAPS_ANDROID_API_KEY_HERE/${MAPS_KEY}/" app.json
          if [ -n "$MAPS_KEY" ]; then echo "Maps key added (${#MAPS_KEY} characters)"; else echo "WARNING: GOOGLE_MAPS_KEY secret is empty"; fi

      - name: Install packages
        working-directory: app
        run: |
          npm install
          npx expo install expo-location expo-task-manager expo-sqlite expo-status-bar react-native-maps react-native-svg react-native-safe-area-context @expo/vector-icons

      - name: Check native modules
        working-directory: app
        run: |
          node -e "const p=require('./package.json');console.log(JSON.stringify(p.dependencies,null,2))"
          npm ls expo-modules-autolinking expo-modules-core || true
          npx expo-modules-autolinking resolve --platform android --json > autolink.json || true
          node -e "const j=require('./autolink.json');(j.modules||[]).forEach((m,i)=>console.log(i,m.packageName,m.packageVersion,JSON.stringify((m.projects||[]).map(p=>p.publication||null))))" || true

      - name: Generate Android project
        working-directory: app
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Publish APK for download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TrailFog build ${{ github.run_number }}
          files: app/android/app/build/outputs/apk/release/*.apk

      # Start the app on a virtual phone and print why it crashes, if it does.
      - name: Write launch test
        run: |
          cat > launch-test.sh <<'EOF'
          set +e
          APK=$(ls app/android/app/build/outputs/apk/release/*.apk | head -1)
          adb install -r "$APK"
          adb logcat -c
          adb shell monkey -p com.trailfog.app -c android.intent.category.LAUNCHER 1
          sleep 30
          adb logcat -d > launch-log.txt
          echo "=================== CRASH REPORT ==================="
          grep -E " E AndroidRuntime| E ReactNativeJS| F libc| E unknown:ReactNative" launch-log.txt | head -70
          echo "=================== IS THE APP RUNNING? ==================="
          if adb shell pidof com.trailfog.app; then echo "YES - TrailFog is running"; else echo "NO - TrailFog crashed"; fi
          exit 0
          EOF

      - name: Enable virtual phone support
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test launch on virtual phone
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash launch-test.sh

      - name: Save full launch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-log
          path: launch-log.txt
          if-no-files-found: ignore
